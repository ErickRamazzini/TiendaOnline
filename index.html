</div>

   <BR>

    <div class="row">

      <div class="col-sm-3">

          <span class="list-group-item">Categoría 1</span>

      <div class="col-sm-9">
        <!-- agregar contenedor vacio que va optener los producto enviado por la api-->
        <div class="row" id="contenedorProductos">
        </div>

    </div>

 </div>  
 <footer class="text-center py-3 mt-4">
    <p class="mb-0">Diseñado por: ERICK ROLANDO RAMAZZINI MURALLES - 1890-23-15896</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
  const url = "https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto";
  const contenedor = document.getElementById("contenedorProductos");

  obtenerProductos();

  async function obtenerProductos() {
    try {
      const respuesta = await fetch(url, { cache: "no-store" });

      if (!respuesta.ok) {
        throw new Error("No se pudo obtener el recurso de la API");
      }

      const productos = await respuesta.json();
      renderizarProductos(productos);

    } catch (error) {
      console.error("Error al cargar productos:", error);
      contenedor.innerHTML = '<div class="alert alert-danger">No se pudieron cargar los productos.</div>';
    }
  }

  function renderizarProductos(productos) {
    contenedor.innerHTML = "";

    productos.forEach(producto => {
      const col = document.createElement("div");
      col.className = "col-sm-12 col-md-4 mb-4";

      let precioHTML = "";

      if (producto.enOferta && producto.precioOferta != null) {
        precioHTML = `
          <span class="text-danger fw-bold">Q.${parseFloat(producto.precioOferta).toFixed(2)}</span>
          <small class="text-muted text-decoration-line-through">Q.${parseFloat(producto.precio).toFixed(2)}</small>
        `;
      } else {
        precioHTML = `Q.${parseFloat(producto.precio).toFixed(2)}`;
      }

      col.innerHTML = `
        <div class="card h-100">
          <img src="${producto.imagen}" class="card-img-top" alt="${producto.nombre}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${producto.nombre}</h5>
            <p class="card-text">${producto.descripcion}</p>
            <p class="fw-bold">${precioHTML}</p>
            <button class="btn btn-dark mt-auto">Agregar al carrito</button>
          </div>
        </div>
      `;

      contenedor.appendChild(col);
    });
  }
</script>
</body>
</html>
